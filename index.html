<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f6f9f"><link rel="manifest" href="manifest.json">
<title>LEAD ENGLISH — Smart Lesson Planner</title>
<style>
:root{--blue:#2f6f9f;--light:#dbe8f5;--ink:#1d2a35;--line:#222}*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{background:linear-gradient(135deg,#255c87,#3d7fae);color:#fff;padding:22px 16px;text-align:center}.top h1{margin:0;font-size:30px}.top p{margin:8px 0 0;font-size:15px}.panel{max-width:1000px;margin:18px auto;padding:18px;background:#fff;border-radius:18px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-weight:700;margin-bottom:6px}.field select,.field input{width:100%;padding:12px;border:1px solid #b9c5cf;border-radius:10px;font-size:16px;background:#fff}.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:#2f6f9f;color:#fff}.secondary{background:#e9eef2}.paperWrap{display:none;max-width:1200px;margin:20px auto}.paper{background:#fff;border:1.5px solid #222;padding:18px 20px;box-shadow:0 3px 14px #0002}.paperTitle{text-align:center;font-family:Georgia,serif;font-size:22px;font-weight:700;margin-bottom:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 28px;font-family:Georgia,serif;font-size:14px;margin-bottom:8px}.meta b{font-weight:700}.outcomes{border:1px solid #222;display:grid;grid-template-columns:210px 1fr;font-family:Georgia,serif}.outcomes .label{font-weight:700;text-align:center;padding:12px;border-right:1px solid #222;background:#dbe8f5}.outcomes .body{padding:10px 15px;line-height:1.35}.outcomes ul{margin:0;padding-left:20px}.plan{width:100%;border-collapse:collapse;margin-top:8px;font-family:Georgia,serif;font-size:13px}.plan th,.plan td{border:1px solid #222;padding:8px;vertical-align:top}.plan th{background:#c7dcf0;text-align:center}.stage{font-weight:700;width:15%}.teacher{width:36%}.learner{width:36%}.time{width:10%;white-space:nowrap;text-align:center}.reflection{margin-top:10px;font-family:Georgia,serif}.bottom{display:grid;grid-template-columns:30% 70%;gap:8px;margin-top:3px}.reflectBox{border:1px solid #222;border-radius:18px;min-height:100px;padding:12px}.admin{border-collapse:collapse;width:100%;font-size:12px}.admin td{border:1px solid #222;padding:8px}.signs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:16px;font-family:Georgia,serif;font-size:12px}.note{font-size:12px;color:#52606d;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr}.paper{overflow:auto}.signs{grid-template-columns:1fr 1fr}}@media print{body{background:#fff}.top,.panel,.note{display:none}.paperWrap{display:block;margin:0}.paper{box-shadow:none;border:1px solid #222;page-break-inside:avoid}@page{size:A4 landscape;margin:8mm}}
</style></head>
<body>
<header class="top"><h1>LEAD ENGLISH</h1><p>Smart Lesson Planner • Grades 1–6 • Unified Paper Lesson Plan • 5E + Siraj</p></header>
<section class="panel">
<div class="grid">
<div class="field"><label>Grade</label><select id="grade"></select></div>
<div class="field"><label>Semester</label><select id="semester"></select></div>
<div class="field"><label>Unit</label><select id="unit"></select></div>
<div class="field"><label>Lesson</label><select id="lesson"></select></div>
<div class="field"><label>Teacher</label><input id="teacher" value="T. Marina Al_ Baqaeen"></div>
<div class="field"><label>Class / Section</label><input id="section" placeholder="e.g. 5A"></div>
<div class="field"><label>Date</label><input id="date" type="date"></div>
<div class="field"><label>Number of Classes</label><input id="classes" value="1"></div>
</div>
<div class="actions"><button class="btn primary" id="generate">Generate Unified Lesson Plan</button><button class="btn secondary" id="print">Print / Save PDF</button></div>
<div class="note">All grades use the same internal lesson-plan design. Grade 4 is no longer a separate page.</div>
</section>
<section class="paperWrap" id="paperWrap"><div class="paper" id="paper"></div></section>
<script src="curriculum.js"></script>
<script>
const C=window.CURRICULUM?.grades||{};const $=id=>document.getElementById(id);
function options(sel,arr){sel.innerHTML='';arr.forEach((x,i)=>{let o=document.createElement('option');o.value=x;o.textContent=x;sel.appendChild(o)})}
function gradeList(){return Object.keys(C).sort((a,b)=>+a-+b)}
function semesterList(g){return Object.keys(C[g]||{})}
function units(g,s){let x=C[g]?.[s]; if(Array.isArray(x)) return x.map(u=>u.name); return Object.keys(x||{})}
function lessons(g,s,u){let x=C[g]?.[s]; if(Array.isArray(x)){let z=x.find(a=>a.name===u);return z?.lessons||[]} return x?.[u]?.lessons||[]}
function refresh(){let g=$('grade').value,s=$('semester').value;options($('semester'),semesterList(g));if(!semesterList(g).includes(s))s=$('semester').value;let us=units(g,s);options($('unit'),us);options($('lesson'),lessons(g,s,us[0]||''));}
$('grade').addEventListener('change',()=>{refresh();$('unit').dispatchEvent(new Event('change'))});$('semester').addEventListener('change',()=>{let us=units($('grade').value,$('semester').value);options($('unit'),us);options($('lesson'),lessons($('grade').value,$('semester').value,us[0]||''))});$('unit').addEventListener('change',()=>options($('lesson'),lessons($('grade').value,$('semester').value,$('unit').value)));
options($('grade'),gradeList());refresh();$('date').value=new Date().toISOString().slice(0,10);
function plan(){let g=$('grade').value,s=$('semester').value,u=$('unit').value,l=$('lesson').value;let type=l.toLowerCase();let focus=type.includes('phon')?'phonics and pronunciation':type.includes('story')?'reading, comprehension and values':type.includes('grammar')?'grammar in meaningful context':type.includes('vocabulary')?'vocabulary in context':type.includes('writing')?'guided writing':type.includes('listening')?'listening and speaking':type.includes('culture')?'culture and communication':'integrated English skills';let outcomes=[`Students will understand and use the target language related to ${focus}.`,`Students will participate in purposeful pair/group activities and communicate using appropriate English.`,`Students will demonstrate learning through a short formative check or performance task.`];let rows=[['1 – Engagement',`Activate prior knowledge through a short visual, question, model or classroom prompt related to <b>${l}</b>. Siraj supports the teacher by providing/organising the prompt and guiding attention to the learning target.`,`Respond, predict, discuss with a partner, and share prior knowledge. Use the prompt and Siraj-supported resources to state what they already know.`,`10 min`],['2 – Exploration / Explanation',`Model the target language and meaning. Check understanding with examples, concept questions and guided practice. Siraj is integrated as a digital support: presenting examples, prompting questions, giving immediate feedback, or displaying practice.`,`Observe, listen, ask questions, identify patterns, practise examples and explain answers.`,`15 min`],['3 – Elaboration',`Facilitate pair/group tasks, differentiate support, monitor performance and give feedback. Siraj supports practice, retrieval, feedback and extension while the teacher remains the learning facilitator.`,`Apply the target language in exercises, pair/group communication, reading/listening/speaking/writing tasks as appropriate.`,`15 min`],['4 – Closing / Evaluation',`Review the key learning, elicit evidence of understanding, give a quick formative assessment and identify next steps.`,`Answer an exit question/task, self-check learning and state one thing learned or improved.`,`5 min`]];
let date=$('date').value||'';let pretty=date?new Date(date+'T00:00:00').toLocaleDateString('en-GB'):'';let html=`<div class="paperTitle">Lesson Plan</div><div class="meta"><div><b>Class/Level:</b> ${g}th Grade</div><div><b>Subject:</b> English Language</div><div><b>Number of Classes:</b> ${$('classes').value}</div><div><b>Unit Title:</b> ${u}</div><div><b>Lesson Title:</b> ${l}</div><div><b>Teacher:</b> ${$('teacher').value}</div><div><b>Class/Section:</b> ${$('section').value}</div><div><b>Date:</b> ${pretty}</div></div><div class="outcomes"><div class="label">The Main<br>Outcomes:</div><div class="body"><ul>${outcomes.map(x=>`<li>${x}</li>`).join('')}</ul></div></div><table class="plan"><thead><tr><th>The Stages</th><th>Teacher Action + Siraj Integration</th><th>Learner Action</th><th>Time</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="stage">${r[0]}</td><td class="teacher">${r[1]}</td><td class="learner">${r[2]}</td><td class="time">${r[3]}</td></tr>`).join('')}</tbody></table><div class="reflection"><b>Self-Reflection on Learning and Teaching:</b></div><div class="bottom"><div class="reflectBox"></div><table class="admin"><tr><td><b>Class/Section</b></td><td>${$('section').value}</td><td></td><td></td><td></td></tr><tr><td><b>Number of absent students/Total number</b></td><td></td><td></td><td></td><td></td></tr><tr><td><b>The class order in the timetable</b></td><td></td><td></td><td></td><td></td></tr><tr><td><b>Day/Date</b></td><td>${pretty}</td><td></td><td></td><td></td></tr></table></div><div class="signs"><div>Teacher’s Name and Signature:</div><div>Supervisor’s Signature:</div><div>Principal’s Signature:</div><div>School Development Consultant:</div></div>`;return html}
$('generate').onclick=()=>{$('paper').innerHTML=plan();$('paperWrap').style.display='block';window.scrollTo({top:$('paperWrap').offsetTop,behavior:'smooth'})};$('print').onclick=()=>{if(!$('paper').innerHTML)$('paper').innerHTML=plan();$('paperWrap').style.display='block';window.print()};
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
