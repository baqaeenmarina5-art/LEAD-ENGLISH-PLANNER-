<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f6f9f"><title>LEAD ENGLISH Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;font-family:Arial;color:#17324d}header{background:linear-gradient(135deg,#1f4f73,#2f6f9f);color:white;text-align:center;padding:24px 15px;border-radius:0 0 28px 28px}header h1{margin:0 0 6px}header p{margin:0;line-height:1.4}main{max-width:1100px;margin:18px auto;padding:0 14px}.card{background:white;border:1px solid #d3dce5;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #1e325a12}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:13px;border:1px solid #c7d1dc;border-radius:12px;background:white;font:inherit}select:disabled{background:#f2f4f7;color:#98a2b3}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:12px 17px;font-weight:700;font:inherit}.blue{background:#2f6f9f;color:white}.green{background:#2f8b67;color:white}.gold{background:#e5b83f}.status{margin-top:12px;padding:10px;border-radius:10px;background:#f5f8fb;color:#65758b;font-size:13px}.error{background:#fff1f0;color:#a33}.objective{background:#f7f9fc;border-left:5px solid #2f6f9f;padding:13px;border-radius:9px;line-height:1.55}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}th,td{border:1px solid #bfc8d8;padding:9px;vertical-align:top}th{background:#eef2f8;text-align:left}.stage{font-weight:800;color:#1f4f73}.cell{white-space:pre-line;line-height:1.45}.print-title{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media print{@page{size:A4 landscape;margin:9mm}header,.controls{display:none!important}main{max-width:none;margin:0}.card{box-shadow:none;border:0;padding:0}.print-title{display:block}table{font-size:9.5px}}
</style></head><body>
<header><h1>LEAD ENGLISH</h1><p>Smart Lesson Planner • Grades 1–6 • Grade 5 Master Design • 5E + Siraj</p></header>
<main><section class="card controls"><h2>Planner Setup</h2><div class="grid">
<div><label>Grade</label><select id="grade"><option value="">Select Grade</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option></select></div>
<div><label>Semester</label><select id="semester" disabled><option>Select Grade first</option></select></div>
<div><label>Unit</label><select id="unit" disabled><option>Select Semester first</option></select></div>
<div><label>Lesson</label><select id="lesson" disabled><option>Select Unit first</option></select></div>
<div><label>Teacher</label><input id="teacher" value="T. Marina Al_ Baqaeen"></div><div><label>Class / Section</label><input id="className"></div>
<div><label>Date</label><input id="date" type="date"></div><div><label>Duration</label><input id="duration" value="45 minutes"></div></div>
<div class="buttons"><button class="blue" id="generate">Generate Lesson Plan</button><button class="green" onclick="window.print()">Print / Save PDF</button></div>
<div id="status" class="status">Loading curriculum data…</div></section>
<section class="card"><div class="print-title"><h2 id="ptitle"></h2></div><div id="summary" class="objective">Select Grade → Semester → Unit → Lesson.</div><div class="wrap"><table><thead><tr><th>5E Stage</th><th>Teacher Role + Siraj</th><th>Learner Role + Siraj</th><th>Time</th></tr></thead><tbody id="tbody"></tbody></table></div></section></main>
<script>
const SOURCES={"Grade 1":["grade1_source.html"],"Grade 2":["grade2_source.html"],"Grade 3":["grade3_source.html"],"Grade 4":["Grade4_Jordan_TeamTogether_S1_Daily_Planner.html","Grade4_Jordan_TeamTogether_S2_5E_Siraj_Lesson_Planner-3.html"],"Grade 5":["grade5_source.html"],"Grade 6":["grade6_source.html"]};
let ALL=[];const $=x=>document.getElementById(x);$("date").valueAsDate=new Date();
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function status(t,e=false){$("status").textContent=t;$("status").className="status"+(e?" error":"")}
function extract(t){let p=t.indexOf("const DATA");if(p<0)return[];let s=t.indexOf("[",p),d=0,q=false,z=false;if(s<0)return[];for(let i=s;i<t.length;i++){let c=t[i];if(q){if(z)z=false;else if(c=="\")z=true;else if(c=='"')q=false;continue}if(c=='"'){q=true;continue}if(c=="[")d++;if(c=="]"){d--;if(!d){try{return JSON.parse(t.slice(s,i+1))}catch(e){return[]}}}}return[]}
function norm(a,g,f){return(Array.isArray(a)?a:[]).map((x,i)=>({grade:g,semester:x.semester||x.term||((f.includes("S2")||f.includes("S2_"))?"Semester 2":"Semester 1"),unit:x.unit||x.section||"Unit "+(x.unitNumber||""),lesson:x.lesson||"Lesson "+(i+1),focus:x.focus||x.title||"",aim:x.aim||x.objective||x.objectives||"",pages:x.pages||"",grammar:x.grammar||"",vocab:x.vocab||x.vocabulary||""}))}
async function load(){for(let g in SOURCES)for(let f of SOURCES[g])try{let r=await fetch(f,{cache:"no-store"});if(r.ok){let a=norm(extract(await r.text()),g,f);ALL.push(...a)}}catch(e){}if(ALL.length)status("Curriculum loaded. "+ALL.length+" lesson records available.");else status("No curriculum data loaded. Check that the source HTML files are in the same GitHub Pages root.",true);init()}
function init(){$("grade").onchange=()=>{let g=$("grade").value,s=[...new Set(ALL.filter(x=>x.grade==g).map(x=>x.semester))];$("semester").innerHTML='<option value="">Select Semester</option>'+s.map(x=>'<option>'+esc(x)+'</option>').join("");$("semester").disabled=!s.length;$("unit").disabled=true;$("lesson").disabled=true};
$("semester").onchange=()=>{let g=$("grade").value,s=$("semester").value,u=[...new Set(ALL.filter(x=>x.grade==g&&x.semester==s).map(x=>x.unit))];$("unit").innerHTML='<option value="">Select Unit</option>'+u.map(x=>'<option>'+esc(x)+'</option>').join("");$("unit").disabled=!u.length;$("lesson").disabled=true};
$("unit").onchange=()=>{let g=$("grade").value,s=$("semester").value,u=$("unit").value,a=ALL.filter(x=>x.grade==g&&x.semester==s&&x.unit==u);$("lesson").innerHTML='<option value="">Select Lesson</option>'+a.map((x,i)=>'<option value="'+i+'">'+esc(x.lesson)+(x.focus?" – "+esc(x.focus):"")+'</option>').join("");$("lesson").disabled=!a.length};
$("lesson").onchange=generate}
function current(){let g=$("grade").value,s=$("semester").value,u=$("unit").value,i=$("lesson").value;return ALL.filter(x=>x.grade==g&&x.semester==s&&x.unit==u)[i]}
const stages=[["Engage","8 min"],["Explore","8 min"],["Explain","10 min"],["Elaborate","12 min"],["Evaluate","7 min"]];
function generate(){let d=current();if(!d){$("summary").textContent="Please select Grade, Semester, Unit and Lesson.";return}let t=["Activate prior knowledge, introduce the lesson goal and engage learners.","Guide observation, listening, reading or discovery.","Clarify meaning, form and pronunciation; model and check understanding.","Guide meaningful pair/group practice and differentiation.","Check the objective with questioning, exit ticket or performance."],l=["Recall prior learning and identify the goal.","Observe/listen/read and discover with a partner/group.","Practise target language and answer checks.","Use language in a meaningful task and act on feedback.","Demonstrate learning, self-assess and identify a next step."];$("ptitle").textContent=($("className").value||d.grade)+" • "+d.unit+" • "+d.lesson;$("summary").innerHTML="<b>Learning objective:</b> "+esc(d.aim||"See the selected lesson source.")+"<br><b>Pages:</b> "+esc(d.pages||"—")+" | <b>Grammar:</b> "+esc(d.grammar||"—")+"<br><b>Target vocabulary:</b> "+esc(d.vocab||"—");$("tbody").innerHTML=stages.map((x,i)=>'<tr><td class="stage">'+x[0]+'</td><td class="cell">'+esc(t[i]+"\nSiraj: "+["motivating prompt and retrieval.","guided visual/audio modelling.","modelled examples and checks.","differentiated scaffolding and feedback.","final retrieval/self-assessment."][i])+'</td><td class="cell">'+esc(l[i]+"\nSiraj: "+["interact with the prompt.","use the guided model.","practise and respond.","use support/core/challenge prompts.","complete retrieval/self-assessment."][i])+'</td><td>'+x[1]+'</td></tr>').join("")}
$("generate").onclick=generate;load();
</script></body></html>
