<style>
@page { size: A4 landscape; margin: 7mm; }
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#17202a;font-size:12px}
.app{max-width:1500px;margin:auto;padding:14px}
.toolbar{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #00000010}
.toolbar h1{margin:0 0 8px;text-align:center;font-size:20px}
.controls{display:grid;grid-template-columns:1fr 1fr 2fr auto auto;gap:8px;align-items:end}
label{font-weight:bold;font-size:11px}
select,input,button{width:100%;padding:8px;border:1px solid #94a3b8;border-radius:6px;background:white;font:inherit}
button{cursor:pointer;background:#2563eb;color:#fff;border-color:#2563eb;font-weight:bold}
button.secondary{background:#475569;border-color:#475569}
button.green{background:#15803d;border-color:#15803d}
.meta{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}
.meta div{border:1px solid #cbd5e1;padding:5px;background:#f8fafc}
.meta b{display:block;font-size:10px;color:#475569}
.lesson-plan{background:#fff;padding:7mm;border:1px solid #cbd5e1;min-height:180mm}
.plan-title{text-align:center;margin:0 0 5px;font-size:18px}
.subtitle{text-align:center;margin:0 0 7px;font-size:11px}
.outcomes{border-collapse:collapse;width:100%;margin-bottom:7px}
.outcomes td{border:1px solid #334155;padding:5px;vertical-align:top}
.outcomes .head{background:#dbeafe;font-weight:bold;width:16%}
.table{border-collapse:collapse;width:100%;table-layout:fixed}
.table th,.table td{border:1px solid #334155;padding:5px;vertical-align:top}
.table th{background:#93c5fd;text-align:center;font-size:11px}
.stage{width:13%;font-weight:bold}
.teacher{width:39%}
.learner{width:39%}
.time{width:9%;text-align:center}
.row-engage{background:#dbeafe}.row-explore{background:#fef3c7}.row-explain{background:#fef3c7}.row-elaborate{background:#ecfccb}.row-evaluate{background:#fee2e2}
.reflection{margin-top:7px;display:grid;grid-template-columns:1fr 2fr;gap:7px}
.refbox{height:42px;border:1px solid #334155;background:#dbeafe;border-radius:8px}
.admin{border-collapse:collapse;width:100%}.admin td{border:1px solid #334155;padding:4px;height:21px}.admin td:first-child{font-weight:bold;width:35%}
.sign{display:flex;justify-content:space-between;margin-top:7px;font-size:10px}
.footer{font-size:9px;text-align:right;margin-top:2px;font-weight:bold}
.note{font-size:10px;color:#475569;margin-top:6px}
@media print{
 body{background:white;font-size:10px}
 .no-print{display:none!important}
 .app{padding:0;max-width:none}
 .lesson-plan{border:0;padding:0;min-height:0}
 .table th,.table td{padding:4px}
 .toolbar{display:none}
}

  .iso-footer {
    margin-top: 5px;
    text-align: right;
    font-size: 8.5px;
    font-weight: bold;
    color: #111;
  }

</style>

const semesterSelect=document.getElementById('semester');
const unitSelect=document.getElementById('unit');
const lessonSelect=document.getElementById('lesson');
const dateInput=document.getElementById('date');

const semesters=[...new Set(plans.map(p=>p.sem))];
semesterSelect.innerHTML=semesters.map(s=>`<option>${s}</option>`).join('');

function fillUnits(){
 const sem=semesterSelect.value;
 const units=[...new Map(plans.filter(p=>p.sem===sem).map(p=>[p.unit,p])).values()];
 unitSelect.innerHTML=units.map(u=>`<option value="${u.unit}">${u.unit} – ${u.title}</option>`).join('');
 fillLessons();
}
function fillLessons(){
 const sem=semesterSelect.value, unit=unitSelect.value;
 const arr=plans.filter(p=>p.sem===sem && p.unit===unit);
 lessonSelect.innerHTML=arr.map(p=>`<option value="${p.id}">${p.lesson} – ${p.focus}</option>`).join('');
 render();
}
function render(){
 const p=plans.find(x=>x.id===lessonSelect.value) || plans[0];
 const d=dateInput.value ? new Date(dateInput.value+'T00:00:00').toLocaleDateString('en-GB') : '________________';
 const rows=p.stages.map(s=>{
   const cls='row-'+s[0].toLowerCase();
   return `<tr class="${cls}">
     <td class="stage">${s[0]}</td>
     <td class="teacher">${s[1]}</td>
     <td class="learner">${s[2]}</td>
     <td class="time">${s[3]}</td>
   </tr>`;
 }).join('');
 document.getElementById('plan').innerHTML=`
 <h2 class="plan-title">Lesson Plan</h2>
 <div class="subtitle"><b>${p.sem} • ${p.unit} – ${p.title}</b> • ${p.lesson} • ${p.focus}</div>
 <div class="meta">
   <div><b>Class / Level</b>Grade 2</div>
   <div><b>Subject</b>English Language</div>
   <div><b>Page(s)</b>Pupil’s Book p. ${p.page}</div>
   <div><b>Date</b>${d}</div>
   <div><b>Duration</b>45 minutes</div>
 </div>
 <table class="outcomes">
   <tr><td class="head">Learning Outcomes</td><td>By the end of the lesson, pupils will be able to ${p.aim}.</td></tr>
   <tr><td class="head">Target Language</td><td><b>Vocabulary:</b> ${p.vocab}<br><b>Grammar:</b> ${p.grammar}<br><b>Function:</b> ${p.function}<br><b>Phonics:</b> ${p.phonics}</td></tr>
 </table>
 <table class="table">
  <thead><tr><th class="stage">5E</th><th class="teacher">Teacher Role</th><th class="learner">Learner Role</th><th class="time">Time</th></tr></thead>
  <tbody>${rows}</tbody>
 </table>
 <div class="reflection">
   <div><b>Self-Reflection on Learning and Teaching</b><div class="refbox"></div></div>
   <table class="admin">
    <tr><td>Class / Section</td><td></td></tr>
    <tr><td>Absent / Total</td><td></td></tr>
    <tr><td>Lesson Order</td><td></td></tr>
    <tr><td>Day / Date</td><td>${d}</td></tr>
   </table>
 </div>
 <div class="sign"><span>Teacher’s Name & Signature: ____________________</span><span>Supervisor’s Signature: ____________________</span><span>Principal’s Signature: ____________________</span></div>
 <div class="footer">FORM – Grade 2 English Daily Lesson Plan</div>
 `;
}
function printPlan(){
 render();
 setTimeout(()=>window.print(),100);
}
semesterSelect.addEventListener('change',fillUnits);
unitSelect.addEventListener('change',fillLessons);
lessonSelect.addEventListener('change',render);
dateInput.addEventListener('change',render);
fillUnits();
</script>
